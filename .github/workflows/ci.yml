# lab-api CI：测试 → 构建 ARM64 镜像 → 推送到 Harbor lab 项目
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # GitHub 托管的 ARM64 Runner，原生构建 arm64 镜像，不需要 QEMU 模拟
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: 静态检查与测试
        run: |
          go vet ./...
          go test ./...

      - name: 生成镜像 tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.HARBOR_HOST }}/lab/lab-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      # PR 只构建不推送：来自 fork 的 PR 拿不到 secrets，也不应该往仓库推镜像
      - name: 登录 Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
